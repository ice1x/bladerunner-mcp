# Copy to ~/.bladerunner_mcp.yaml (or point BLADERUNNER_MCP_CONFIG at it).
# The model only ever sees the aliases (hetzner-prod, legacy-box), never the secrets.
hosts:
  hetzner-prod:
    host: 203.0.113.10
    user: root
    port: 22
    key_path: ~/.ssh/id_ed25519
    strict_host_key: true     # verify against system known_hosts (default: false)
    allow_dangerous: false    # keep the safety filters on (default)
    # protected_paths: [/etc, /var/lib]               # override the default protected list
    # allowed_remote_paths: [/srv/app, /var/log/app]  # opt-in transfer allowlist
    # allowed_local_paths: [~/deploys]
  legacy-box:
    host: 198.51.100.7
    user: deploy
    password: "prefer-key-auth"  # password auth needs sshpass installed for file transfer
